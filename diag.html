<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostics</title>
<style>
 body{font:16px/1.5 -apple-system,sans-serif;margin:0;padding:16px;background:#fff;color:#111}
 h1{font-size:18px;margin:0 0 12px}
 table{border-collapse:collapse;width:100%;font-size:15px}
 td{padding:6px 4px;border-bottom:1px solid #eee;vertical-align:top}
 td:first-child{color:#666;width:52%}
 td:last-child{font-weight:700;font-variant-numeric:tabular-nums}
 .bad{color:#c00}.good{color:#080}
 #bar{height:70px;background:#04474F;color:#fff;display:flex;align-items:center;
      justify-content:center;font-weight:700;margin:14px 0}
 p{font-size:14px;color:#555}
</style>
<h1>Beacon Star — 版面診斷</h1>
<div id="bar">這條深色橫幅應該剛好滿版</div>
<table id="t"></table>
<p>請左右滑動畫面，再截圖。<br>下方 scrollX 若不是 0，代表頁面真的可以橫向移動。</p>
<script>
function paint(){
  const de=document.documentElement, vv=window.visualViewport||{};
  const rows=[
    ['螢幕寬 screen.width', screen.width],
    ['視窗寬 innerWidth', innerWidth],
    ['版面寬 clientWidth', de.clientWidth],
    ['內容寬 scrollWidth', de.scrollWidth],
    ['超出量 (內容−版面)', de.scrollWidth-de.clientWidth],
    ['橫向捲動位置 scrollX', Math.round(scrollX)],
    ['視覺縮放 vv.scale', (vv.scale||1).toFixed(3)],
    ['視覺視窗寬 vv.width', Math.round(vv.width||0)],
    ['視覺偏移 vv.offsetLeft', Math.round(vv.offsetLeft||0)],
    ['像素比 devicePixelRatio', devicePixelRatio],
    ['橫幅實際寬度', Math.round(document.getElementById('bar').getBoundingClientRect().width)],
  ];
  document.getElementById('t').innerHTML = rows.map(([k,v])=>{
    let cls='';
    if(k.startsWith('超出量')) cls = v>2?'bad':'good';
    if(k.startsWith('橫向捲動')) cls = v!==0?'bad':'good';
    if(k.startsWith('視覺縮放')) cls = Math.abs(v-1)>0.01?'bad':'good';
    return `<tr><td>${k}</td><td class="${cls}">${v}</td></tr>`;
  }).join('');
}
paint();
addEventListener('scroll',paint,{passive:true});
addEventListener('resize',paint);
if(window.visualViewport){visualViewport.addEventListener('resize',paint);visualViewport.addEventListener('scroll',paint);}
</script>
